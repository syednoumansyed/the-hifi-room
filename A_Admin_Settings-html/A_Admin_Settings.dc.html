<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: #EFEBE0; color: #1B1812; }
    a { color: #2E6FA3; text-decoration: none; }
    a:hover { color: #1B4D73; }
    .nav-item { transition: background 150ms ease; }
    .nav-item:hover { background: #E2DCC9; }
    .ghost-btn { transition: background 150ms ease; }
    .ghost-btn:hover { background: #E2DCC9; }
    .paper { background: #FBF9F3; box-shadow: 0 12px 24px -14px rgba(27,24,18,0.22); }
    .field-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4B4B45; margin-bottom: 6px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; border: 1px solid #C9C2B2; background: #FBF9F3; padding: 11px 13px; font-size: 14px; color: #1B1812; font-family: 'IBM Plex Sans', sans-serif; }
    .field-input:focus { outline: 2px solid #2E6FA3; outline-offset: 1px; }
    .tag-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #C9C2B2; background: #FBF9F3; padding: 6px 10px 6px 12px; font-size: 13px; }
    .tag-x { cursor: pointer; opacity: 0.6; }
    .tag-x:hover { opacity: 1; }
  
    /* HiFi Room Responsive Patch */
    @media (max-width: 900px) {
      div[style*="grid-template-columns: repeat(4"],
      div[style*="grid-template-columns: repeat(5"],
      div[style*="grid-template-columns: 1fr 1fr 1fr"] {
        grid-template-columns: 1fr 1fr !important;
      }
      div[style*="display:flex"][style*="gap:56px"],
      div[style*="display:flex"][style*="gap:40px"] {
        flex-direction: column !important;
        gap: 24px !important;
      }
    }
    @media (max-width: 640px) {
      div[style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
      }
      div[style*="padding:88px 56px"],
      div[style*="padding:72px 56px"],
      div[style*="padding:64px 56px"],
      div[style*="padding:56px"] {
        padding: 24px 16px !important;
      }
      h1[style*="font-size:82px"], h1[style*="font-size:52px"], h1[style*="font-size:46px"], h1[style*="font-size:42px"] {
        font-size: 36px !important;
      }
    }
    
  </style>
</helmet>

<div style="width: 100%; max-width: 1440px; margin: 0 auto; min-height: 100vh; box-sizing:border-box; background-color:#EFEBE0; background-image: repeating-linear-gradient(0deg, rgba(27,24,18,0.04) 0px, rgba(27,24,18,0.04) 1px, transparent 1px, transparent 26px), repeating-linear-gradient(90deg, rgba(27,24,18,0.04) 0px, rgba(27,24,18,0.04) 1px, transparent 1px, transparent 26px); color:#1B1812; display:flex;">

  <!-- Sidebar -->
  <div style="width:220px; flex-shrink:0; border-right:1px solid #C9C2B2; display:flex; flex-direction:column; padding:24px 0; background:rgba(251,249,243,0.5);">
    <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.12em; padding:0 24px 24px 24px; border-bottom:1px solid #C9C2B2;">THE HIFI ROOM<br><span style="color:#8A8A82; font-size:11px; letter-spacing:0.08em;">CONSOLE</span></div>
    <div style="display:flex; flex-direction:column; padding:16px 12px; gap:2px;">
      <div class="nav-item" style="display:flex; align-items:center; gap:12px; padding:12px 12px; color:#4B4B45;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
        <span style="font-size:13px;">Overview</span>
      </div>
      <div class="nav-item" style="display:flex; align-items:center; gap:12px; padding:12px 12px; color:#4B4B45;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="1"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span style="font-size:13px;">Inventory</span>
      </div>
      <div class="nav-item" style="display:flex; align-items:center; gap:12px; padding:12px 12px; color:#4B4B45;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
        <span style="font-size:13px;">Seller leads</span>
      </div>
      <div class="nav-item" style="display:flex; align-items:center; gap:12px; padding:12px 12px; color:#4B4B45;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>
        <span style="font-size:13px;">Sourcing requests</span>
      </div>
      <div class="nav-item" style="display:flex; align-items:center; gap:12px; padding:12px 12px; background:#1B1812; color:#F9F7F0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span style="font-size:13px;">Settings</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div style="flex:1; padding:40px 48px 80px 48px; display:flex; flex-direction:column; gap:28px;">
    <div style="display:flex; align-items:center; gap:16px;">
      <svg width="46" height="46" viewBox="0 0 128 128" style="transform:rotate(-6deg); flex-shrink:0;">
        <defs><path id="ringSet" d="M 64,64 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0"></path></defs>
        <circle cx="64" cy="64" r="58" fill="none" stroke="#1B1812" stroke-width="1.4"></circle>
        <text font-family="IBM Plex Mono" font-size="8" letter-spacing="2" fill="#1B1812">
          <textPath href="#ringSet" startOffset="2%">INTERNAL • BENCH VERIFIED • THE HIFI ROOM •</textPath>
        </text>
      </svg>
      <div>
        <h1 style="margin:0; font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:26px;">Settings</h1>
        <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:#8A8A82; margin-top:4px;">Store &amp; operations</div>
      </div>
    </div>

    <div style="max-width:840px; display:flex; flex-direction:column; gap:24px;">

      <!-- Contact -->
      <div class="paper" style="border:1px solid #C9C2B2;">
        <div style="padding:16px 24px; border-bottom:1px solid #C9C2B2; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em; color:#2E6FA3;">CONTACT</div>
        <div style="padding:24px; display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
          <div>
            <label class="field-label">WhatsApp number</label>
            <input class="field-input" type="text" value="+91 97113 93036" style="font-family:'IBM Plex Mono', monospace;">
          </div>
          <div>
            <label class="field-label">Studio address</label>
            <input class="field-input" type="text" value="Bandra West, Mumbai">
          </div>
          <div style="grid-column: 1 / -1;">
            <label class="field-label">Studio hours</label>
            <input class="field-input" type="text" value="By appointment · Mon–Sat, 11:00–19:00 IST">
          </div>
        </div>
      </div>

      <!-- Storefront copy -->
      <div class="paper" style="border:1px solid #C9C2B2;">
        <div style="padding:16px 24px; border-bottom:1px solid #C9C2B2; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em; color:#2E6FA3;">STOREFRONT COPY</div>
        <div style="padding:24px; display:flex; flex-direction:column; gap:20px;">
          <div>
            <label class="field-label">Announcement banner</label>
            <input class="field-input" type="text" value="New arrivals from a Bandra collection — 6 units, all Grade A–B.">
          </div>
          <div>
            <label class="field-label">Ticker line</label>
            <input class="field-input" type="text" value="18 units placed this month · 9 sourcing requests open" style="font-family:'IBM Plex Mono', monospace;">
          </div>
          <div style="display:flex; align-items:flex-end; gap:10px;">
            <div style="width:140px;">
              <label class="field-label">Return / inspection window</label>
              <input class="field-input" type="text" value="7" style="font-family:'IBM Plex Mono', monospace; text-align:right;">
            </div>
            <div style="font-size:14px; color:#4B4B45; padding-bottom:11px;">days</div>
          </div>
        </div>
      </div>

      <!-- Sourcing -->
      <div class="paper" style="border:1px solid #C9C2B2;">
        <div style="padding:16px 24px; border-bottom:1px solid #C9C2B2; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em; color:#2E6FA3;">SOURCING</div>
        <div style="padding:24px; display:flex; flex-direction:column; gap:12px;">
          <label class="field-label" style="margin-bottom:0;">Accepted brands</label>
          <div style="display:flex; flex-wrap:wrap; gap:10px;">
            <span class="tag-chip">Technics <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="tag-chip">Marantz <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="tag-chip">McIntosh <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="tag-chip">Thorens <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="tag-chip">NAD <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="tag-chip">Sansui <svg class="tag-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
            <span class="ghost-btn" style="display:inline-flex; align-items:center; gap:6px; border:1px dashed #8A8A82; padding:6px 12px; font-size:13px; color:#4B4B45; cursor:pointer;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4B4B45" stroke-width="2.4"><line x1="12" y1="4" x2="12" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line></svg>
              Add brand
            </span>
          </div>
        </div>
      </div>

    </div>

    <!-- Save bar -->
    <div style="max-width:840px; position:sticky; bottom:24px; margin-top:8px;">
      <div class="paper" style="border:1px solid #1B1812; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
        <span style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:#8A8A82;">Unsaved changes will not affect the live storefront until saved.</span>
        <div style="display:flex; gap:12px;">
          <button class="ghost-btn" style="background:transparent; border:1px solid #1B1812; font-size:13px; padding:11px 20px; cursor:pointer;">Discard</button>
          <button style="background:#1B1812; color:#F9F7F0; border:none; font-size:13px; padding:11px 22px; cursor:pointer;">Save changes</button>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
