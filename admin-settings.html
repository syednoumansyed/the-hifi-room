<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Console Sidebar -->

      <a href="index.html" style="color:var(--ink-primary); font-weight:700;">THE HIFI ROOM</a><br>
      <span style="color:var(--ink-muted); font-size:11px; letter-spacing:0.08em;">STAFF CONSOLE</span>
    </div>

    <nav class="console-nav-items" style="display:flex; flex-direction:column; padding:16px 12px; gap:4px;">
      <a href="admin.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
        <span>Overview</span>
      </a>
      <a href="admin-inventory.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="1"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>Inventory Manager</span>
      </a>
      <a href="admin-leads.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
        <span>Seller Leads</span>
      </a>
      <a href="admin-requests.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>
        <span>Sourcing Requests</span>
      </a>
      <a href="admin-settings.html" class="console-nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Store Settings</span>
      </a>
      
      <div style="margin-top:auto; padding-top:20px; border-top:1px dashed var(--border-main);">
        <a href="index.html" class="console-nav-item" style="color:var(--accent-cobalt);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          <span>View Public Store</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="console-main">
    
    <div>
      <h1 style="font-size:28px; margin:0;">Store & Workshop Settings</h1>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);">Studio contact, WhatsApp channel, shipping notes & bench rules</div>
    </div>

    <form onsubmit="handleSettingsSave(event)" class="paper" style="border:1px solid var(--border-main); padding:clamp(20px, 4vw, 36px); max-width:800px; display:flex; flex-direction:column; gap:20px;">
      
      <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-cobalt); font-weight:600; border-bottom:1px solid var(--border-main); padding-bottom:12px;">
        1. Studio Contact Information
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
        <div class="field-group">
          <label class="field-label">STORE NAME</label>
          <input type="text" id="setting-storeName" class="field-input" value="THE HIFI ROOM">
        </div>
        <div class="field-group">
          <label class="field-label">WHATSAPP CONCIERGE</label>
          <input type="text" id="setting-whatsapp" class="field-input" value="+91 97113 93036">
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
        <div class="field-group">
          <label class="field-label">EMAIL</label>
          <input type="email" id="setting-email" class="field-input" value="info@thehifiroom.in">
        </div>
        <div class="field-group">
          <label class="field-label">STUDIO ADDRESS</label>
          <input type="text" id="setting-address" class="field-input" value="Bandra West, Mumbai 400050">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">STUDIO HOURS & APPOINTMENTS</label>
        <input type="text" id="setting-hours" class="field-input" value="By appointment · Mon–Sat, 11:00–19:00 IST">
      </div>

      <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-cobalt); font-weight:600; border-bottom:1px solid var(--border-main); padding-bottom:12px; margin-top:10px;">
        2. Storefront Copy & Trust Messaging
      </div>

      <div class="field-group">
        <label class="field-label">HERO HEADLINE</label>
        <input type="text" id="setting-heroHeading" class="field-input" value="Every unit, bench-tested and on the record.">
      </div>

      <div class="field-group">
        <label class="field-label">HERO SUBHEADING</label>
        <textarea id="setting-heroSubheading" class="field-textarea">Browse graded turntables, amplifiers and speakers, make an offer on your own terms, sell what you no longer play, or tell us what to find for you. One record, kept in the open.</textarea>
      </div>

      <div class="field-group">
        <label class="field-label">SHIPPING POLICY NOTE</label>
        <input type="text" id="setting-shippingNote" class="field-input" value="Pan-India tracked white-glove shipping in custom wooden crates">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:10px; padding-top:16px; border-top:1px dashed var(--border-main);">
        <button type="submit" class="btn btn-primary" style="min-width:200px;">Save Configuration</button>
      </div>

    </form>

  </main>
</div>

<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const res = await fetchAPI('/api/settings');
  if (res && res.success && res.data) {
    const s = res.data;
    if (s.storeName) document.getElementById('setting-storeName').value = s.storeName;
    if (s.whatsapp) document.getElementById('setting-whatsapp').value = s.whatsapp;
    if (s.email) document.getElementById('setting-email').value = s.email;
    if (s.address) document.getElementById('setting-address').value = s.address;
    if (s.hours) document.getElementById('setting-hours').value = s.hours;
    if (s.heroHeading) document.getElementById('setting-heroHeading').value = s.heroHeading;
    if (s.heroSubheading) document.getElementById('setting-heroSubheading').value = s.heroSubheading;
    if (s.shippingNote) document.getElementById('setting-shippingNote').value = s.shippingNote;
  }
});

async function handleSettingsSave(e) {
  e.preventDefault();
  const updated = {
    storeName: document.getElementById('setting-storeName').value,
    whatsapp: document.getElementById('setting-whatsapp').value,
    email: document.getElementById('setting-email').value,
    address: document.getElementById('setting-address').value,
    hours: document.getElementById('setting-hours').value,
    heroHeading: document.getElementById('setting-heroHeading').value,
    heroSubheading: document.getElementById('setting-heroSubheading').value,
    shippingNote: document.getElementById('setting-shippingNote').value
  };

  try {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updated)
    });
    showToast('Store settings saved successfully!', 'success');
  } catch (err) {
    showToast('Saved locally.', 'success');
  }
}
</script>
</body>
</html>
