<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Manager — Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#EFEBE0;">

<div class="console-layout">
  
  <!-- Console Sidebar -->
  <aside class="console-sidebar">
    <div style="font-family:var(--font-mono); font-size:13px; letter-spacing:0.14em; padding:0 24px 20px 24px; border-bottom:1px solid var(--border-main);">
      <a href="index.html" style="color:var(--ink-primary); font-weight:700;">THE HIFI ROOM</a><br>
      <span style="color:var(--ink-muted); font-size:11px; letter-spacing:0.08em;">STAFF CONSOLE</span>
    </div>

    <nav class="console-nav-items" style="display:flex; flex-direction:column; padding:16px 12px; gap:4px;">
      <a href="admin.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
        <span>Overview</span>
      </a>
      <a href="admin-inventory.html" class="console-nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="1"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>Inventory Manager</span>
      </a>
      <a href="admin-leads.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
        <span>Seller Leads</span>
      </a>
      <a href="admin-requests.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>
        <span>Sourcing Requests</span>
      </a>
      <a href="admin-settings.html" class="console-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Store Settings</span>
      </a>
      
      <div style="margin-top:auto; padding-top:20px; border-top:1px dashed var(--border-main);">
        <a href="index.html" class="console-nav-item" style="color:var(--accent-cobalt);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          <span>View Public Store</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="console-main">
    
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 style="font-size:28px; margin:0;">Inventory Catalog</h1>
        <div style="font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);">Manage unit bench reports, pricing, status & telemetry</div>
      </div>

      <button onclick="openAddProductModal()" class="btn btn-primary btn-sm">
        + Add New Unit
      </button>
    </div>

    <!-- Toolbar -->
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div style="position:relative; min-width:260px; flex:1; max-width:380px;">
        <input type="text" id="admin-search-input" class="field-input" placeholder="Search SKU, brand, model..." style="height:38px; padding-left:34px; font-size:13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" style="position:absolute; left:12px; top:12px;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>
      </div>

      <select id="admin-category-select" style="height:38px; border:1px solid var(--border-main); background:var(--bg-paper); padding:0 12px; font-family:var(--font-mono); font-size:12px; color:var(--ink-primary); cursor:pointer;">
        <option value="All">All Categories</option>
        <option value="Amplifiers">Amplifiers</option>
        <option value="Reel-to-Reel">Reel-to-Reel</option>
        <option value="Turntables">Turntables</option>
        <option value="Speakers">Loudspeakers</option>
        <option value="Receivers">Receivers</option>
        <option value="Cassette decks">Cassette Decks</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-container paper">
      <table class="hifi-table">
        <thead>
          <tr>
            <th style="width:30px;"><input type="checkbox"></th>
            <th>UNIT / BRAND</th>
            <th>GRADE</th>
            <th>CATEGORY</th>
            <th>PRICE (₹)</th>
            <th>STATUS</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="inventory-table-body">
          <!-- Populated via admin.js -->
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Modal: Add Product -->
<div id="add-product-modal" class="modal-overlay">
  <div class="modal-dialog">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-main); padding-bottom:16px; margin-bottom:20px;">
      <h3 style="font-size:22px; margin:0;">Add New Catalog Unit</h3>
      <button onclick="closeAddProductModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--ink-primary);">&times;</button>
    </div>

    <form onsubmit="handleAddProductSubmit(event)" style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field-group">
          <label class="field-label">BRAND</label>
          <input type="text" name="brand" class="field-input" placeholder="e.g. McIntosh" required>
        </div>
        <div class="field-group">
          <label class="field-label">MODEL</label>
          <input type="text" name="model" class="field-input" placeholder="e.g. MC275" required>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field-group">
          <label class="field-label">DISPLAY NAME</label>
          <input type="text" name="name" class="field-input" placeholder="e.g. McIntosh MC275" required>
        </div>
        <div class="field-group">
          <label class="field-label">CATEGORY</label>
          <select name="category" class="field-input" style="height:44px;">
            <option value="Amplifiers">Amplifiers</option>
            <option value="Reel-to-Reel">Reel-to-Reel</option>
            <option value="Turntables">Turntables</option>
            <option value="Speakers">Speakers</option>
            <option value="Receivers">Receivers</option>
            <option value="Cassette decks">Cassette Decks</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
        <div class="field-group">
          <label class="field-label">GRADE</label>
          <select name="grade" class="field-input" style="height:44px;">
            <option value="A+">A+ (Mint)</option>
            <option value="A" selected>A (Excellent)</option>
            <option value="B">B (Very Good)</option>
            <option value="C">C (Fair)</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">SCORE (out of 10)</label>
          <input type="text" name="conditionScore" class="field-input" placeholder="9.2/10">
        </div>
        <div class="field-group">
          <label class="field-label">PRICE (₹)</label>
          <input type="number" name="price" class="field-input" placeholder="65000" required>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field-group">
          <label class="field-label">YEAR</label>
          <input type="text" name="year" class="field-input" placeholder="1978">
        </div>
        <div class="field-group">
          <label class="field-label">POWER OUTPUT / SPEC</label>
          <input type="text" name="powerOutput" class="field-input" placeholder="75W x 2">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">IMAGE ASSET PATH</label>
        <select name="mainImage" class="field-input" style="height:44px;">
          <option value="assets/images/01-tube-amplifiers-cinematic.png">01-tube-amplifiers-cinematic.png (Tube Amps Glow)</option>
          <option value="assets/images/02-rear-panel-cinematic.png">02-rear-panel-cinematic.png (Rear Panel Transformers)</option>
          <option value="assets/images/03-wollensak-reel-to-reel-cinematic.png">03-wollensak-reel-to-reel-cinematic.png (Wollensak Front)</option>
          <option value="assets/images/04-wollensak-reel-to-reel-wide-cinematic.png">04-wollensak-reel-to-reel-wide-cinematic.png (Wollensak Studio Wide)</option>
          <option value="assets/images/05-akai-1710w-cinematic.png">05-akai-1710w-cinematic.png (Akai 1710W Walnut)</option>
          <option value="assets/images/06-wollensak-right-reel-detail-cinematic.png">06-wollensak-right-reel-detail-cinematic.png (Reel Macro Detail)</option>
          <option value="assets/images/07-wollensak-three-quarter-cinematic.png">07-wollensak-three-quarter-cinematic.png (Wollensak 3/4)</option>
          <option value="assets/images/08-tube-amplifiers-hero-cinematic.png">08-tube-amplifiers-hero-cinematic.png (Tube Power Hero)</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">DESCRIPTION</label>
        <textarea name="description" class="field-textarea" placeholder="Comprehensive sonic description and restoration details..." required></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">KNOWN FAULTS & PATINA</label>
        <textarea name="knownFaults" class="field-textarea" placeholder="Disclose any minor scuffs or quirks..."></textarea>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field-group">
          <label class="field-label">CITY</label>
          <input type="text" name="city" class="field-input" value="Mumbai">
        </div>
        <div class="field-group">
          <label class="field-label">INITIAL STATUS</label>
          <select name="status" class="field-input" style="height:44px;">
            <option value="Available">Available</option>
            <option value="Reserved">Reserved</option>
            <option value="Draft">Draft</option>
          </select>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:10px;">
        <button type="button" onclick="closeAddProductModal()" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save & Publish Unit</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
